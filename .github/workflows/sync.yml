# Weekly dry-run: rebase the patchset onto current upstream and run the tests.
# If a patch no longer applies, this job fails and GitHub notifies. It does not
# push anything - run `make sync` locally to update the mirror.
#
# Note: scheduled workflows are disabled by default on forks; enable them in the
# Actions tab, or trigger this manually with "Run workflow".
name: upstream-sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  rebase-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add upstream and fetch it
        run: |
          git remote add upstream https://github.com/volotat/mini-AGI
          git fetch upstream main
      - name: Rebase patchset onto upstream (dry run)
        run: |
          git config user.email ci@users.noreply.github.com
          git config user.name ci
          git rebase upstream/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (CPU torch)
        run: |
          python -m pip install -U pip
          python -m pip install numpy pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests on the rebased tree
        run: python -m unittest discover -s tests -v
